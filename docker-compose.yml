services:
  postgres:
    image: postgres:16.4
    container_name: job_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent
      POSTGRES_DB: job_agent
    ports:
      # 5434, а не 5432 чи 5433 - 5433 вже зайнятий PostgreSQL Request Classifier,
      # якщо обидва проєкти запущені одночасно.
      - "5434:5432"
    volumes:
      - job_agent_pgdata:/var/lib/postgresql/data

volumes:
  job_agent_pgdata:
